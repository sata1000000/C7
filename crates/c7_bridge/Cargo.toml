[package]

name = "c7_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"
description = "DAW automation bridge for C7"

[lib]

path = "src/plugin.rs"
crate-type = ["cdylib"]

[build-dependencies]

# Parses the device JSON at build time so `build.rs` can emit the per-device plugin identity.
serde_json = { workspace = true }

[dependencies]

c7_core = { workspace = true }

serde_json = { workspace = true }

# Param-changes push wire frames into this channel. The TCP thread drains it.
async-channel = { workspace = true }

# CLAP plugin framework.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false }

[lints]

workspace = true